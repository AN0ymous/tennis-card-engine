# Runs the engine on GitHub's machines once a day and keeps the results in
# the repo, so nothing of yours has to be switched on. See IPAD_SETUP.md.
name: Scan eBay for bookend cards

on:
  schedule:
    - cron: "17 23 * * *"      # 23:17 UTC = 7:17am Singapore
  # ...and the "Run workflow" button, or the website's "Run a scan", which
  # sends whatever the scan settings were set to. Every input is optional: a
  # scheduled run sends none of them and the engine keeps its own defaults.
  workflow_dispatch:
    inputs:
      players:
        description: 'Players, comma separated (blank = everyone)'
        required: false
      brands:
        description: 'Sets, comma separated (blank = all 7)'
        required: false
      max_print_run:
        description: 'Print-run ceiling (blank = 500)'
        required: false
      print_run_inclusive:
        description: 'Allow a print run equal to the ceiling'
        required: false
        type: boolean
        default: false
      min_price:
        description: 'Lowest price (blank = any)'
        required: false
      max_price:
        description: 'Highest price (blank = any)'
        required: false
      listing_types:
        description: 'buy_now and/or auction (blank = both)'
        required: false
      card_types:
        description: 'base, patch, auto, patch_auto (blank = all)'
        required: false
      conditions:
        description: 'graded and/or raw (blank = both)'
        required: false
      bypass_budget:
        description: 'Bypass the local daily call ceiling (eBay''s own limit still applies)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write              # to commit the results back

concurrency:
  group: scan
  cancel-in-progress: false    # never cut a scan short to start another

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bring back last run's results
        # The engine dedups against seen_items.json and appends to the
        # spreadsheet, so both come back from the results folder first.
        #
        # From whatever main has become, not from this run's checkout. A run
        # dispatched while another is still going is checked out at the commit
        # it was dispatched from, so by the time it starts its results/ can be
        # a scan out of date: runs 48 and 49 on 17 Sep were the same scan nine
        # seconds apart, and the second re-fetched all 949 listings the first
        # had just judged, then stood down at publish having spent them for
        # nothing. RESULTS_BASE remembers where the state came from, so the
        # publish step knows what this run's results were built on.
        run: |
          mkdir -p results
          results_base="$(git rev-parse HEAD)"
          if git fetch -q --depth=1 origin +refs/heads/main:refs/remotes/origin/main \
             && git checkout -q origin/main -- results; then
            git reset -q -- results            # the files, not a staged commit
            results_base="$(git rev-parse origin/main)"
            echo "State files taken from main at ${results_base}."
          else
            echo "Could not read main; using the results in this checkout."
          fi
          echo "RESULTS_BASE=$results_base" >> "$GITHUB_ENV"
          for f in tennis_cards_verified.xlsx seen_items.json scan_cursors.json ebay_api_usage.json vision_cache.json; do
            [ -f "results/$f" ] && cp "results/$f" . || true
          done

      - name: Run the engine
        id: engine
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_FROM_APP_PASSWORD: ${{ secrets.DIGEST_FROM_APP_PASSWORD }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}      # leave unset; "sandbox" only to test keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: outfit colours from photos
          VISION_MODEL: ${{ vars.VISION_MODEL }}               # optional; default claude-opus-5
          # The scan settings, as the website sent them. Empty on a scheduled
          # run, which leaves every engine default in place.
          SCAN_PLAYERS: ${{ inputs.players }}
          SCAN_BRANDS: ${{ inputs.brands }}
          SCAN_MAX_PRINT_RUN: ${{ inputs.max_print_run }}
          SCAN_PRINT_RUN_INCLUSIVE: ${{ inputs.print_run_inclusive }}
          SCAN_MIN_PRICE: ${{ inputs.min_price }}
          SCAN_MAX_PRICE: ${{ inputs.max_price }}
          SCAN_LISTING_TYPES: ${{ inputs.listing_types }}
          SCAN_CARD_TYPES: ${{ inputs.card_types }}
          SCAN_CONDITIONS: ${{ inputs.conditions }}
          SCAN_BYPASS_BUDGET: ${{ inputs.bypass_budget }}
        run: python tennis_card_engine.py

      - name: Export what the hosted site reads
        # always(): the engine now saves what it earned even when it stumbles,
        # but those files live on the runner. If this step were skipped on a
        # failure they would be thrown away with it, which is exactly what the
        # saving was for. A part-finished scan is worth keeping; the run still
        # shows red so the failure is not hidden.
        if: always()
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}      # leave unset; "sandbox" only to test keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: outfit colours from photos
          VISION_MODEL: ${{ vars.VISION_MODEL }}               # optional; default claude-opus-5
          # #18 runs this step even when the engine failed, so the results it
          # saved are not thrown away. The page needs to know that a failed
          # run is what it is looking at, or it reads as a quiet day.
          SCAN_OUTCOME: ${{ steps.engine.outcome }}
          SCAN_BYPASS_BUDGET: ${{ inputs.bypass_budget }}
        run: python export_static.py results

      - name: Keep the results in the repo
        if: always()
        run: |
          git config user.name  "tennis-card-engine"
          git config user.email "tennis-card-engine@users.noreply.github.com"

          # main can move while a scan is running -- a pull request merged, or
          # another scan finishing. A bare push is refused then, and the whole
          # run is thrown away: the spreadsheet rows it found, and the state
          # files that stop the next scan paying for the same listings again.
          # So keep this run's results aside and rebuild the commit on top of
          # whatever main has become.
          keep="$(mktemp -d)"
          cp -a results "$keep/results"
          loaded="$(git rev-parse "${RESULTS_BASE:-HEAD}:results" 2>/dev/null || echo none)"

          for attempt in 1 2 3 4 5; do
            if ! git fetch -q --depth=1 origin +refs/heads/main:refs/remotes/origin/main; then
              echo "Could not reach GitHub (attempt $attempt); trying again."
              sleep $(( attempt * 5 ))
              continue
            fi
            # Another scan that published after this one loaded its state has
            # judged listings this run never saw, so its results are not ours
            # to overwrite: stand down and let the next scan carry on from
            # theirs. Results that have not moved since we loaded them are
            # ours to build on -- what we hold is theirs plus what we judged
            # -- so a pull request merging mid-scan is no reason to stop.
            current="$(git rev-parse origin/main:results 2>/dev/null || echo none)"
            if [ "$loaded" != "$current" ]; then
              echo "Another run published its results after this one started, so this run stands down."
              echo "Nothing is lost from the spreadsheet; the next scan picks up the rest."
              exit 0
            fi

            git reset --hard -q origin/main
            rm -rf results
            cp -a "$keep/results" results
            git add results
            if git diff --cached --quiet; then
              echo "Nothing new this run."
              exit 0
            fi
            git commit -q -m "Scan results, $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push; then
              echo "Results published on attempt $attempt."
              exit 0
            fi

            echo "main moved while this scan was publishing; catching up (attempt $attempt)."
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not publish the results after 5 attempts."
          exit 1

      - name: Offer the spreadsheet as a download too
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tennis_cards_verified
          path: results/tennis_cards_verified.xlsx
          if-no-files-found: ignore
          retention-days: 30
