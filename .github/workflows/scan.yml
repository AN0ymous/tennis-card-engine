# Runs the engine on GitHub's machines once a day and keeps the results in
# the repo, so nothing of yours has to be switched on. See IPAD_SETUP.md.
name: Scan eBay for bookend cards

on:
  schedule:
    - cron: "17 23 * * *"      # 23:17 UTC = 7:17am Singapore
  # ...and the "Run workflow" button, or the website's "Run a scan", which
  # sends whatever the scan settings were set to. Every input is optional: a
  # scheduled run sends none of them and the engine keeps its own defaults.
  workflow_dispatch:
    inputs:
      players:
        description: 'Players, comma separated (blank = everyone)'
        required: false
      brands:
        description: 'Sets, comma separated (blank = all 7)'
        required: false
      max_print_run:
        description: 'Print-run ceiling (blank = 500)'
        required: false
      print_run_inclusive:
        description: 'Allow a print run equal to the ceiling'
        required: false
        type: boolean
        default: false
      min_price:
        description: 'Lowest price (blank = any)'
        required: false
      max_price:
        description: 'Highest price (blank = any)'
        required: false
      listing_types:
        description: 'buy_now and/or auction (blank = both)'
        required: false
      card_types:
        description: 'base, patch, auto, patch_auto (blank = all)'
        required: false
      conditions:
        description: 'graded and/or raw (blank = both)'
        required: false

permissions:
  contents: write              # to commit the results back

concurrency:
  group: scan
  cancel-in-progress: false    # never cut a scan short to start another

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bring back last run's results
        # The engine dedups against seen_items.json and appends to the
        # spreadsheet, so both come back from the results folder first.
        run: |
          mkdir -p results
          for f in tennis_cards_verified.xlsx seen_items.json scan_cursors.json ebay_api_usage.json vision_cache.json; do
            [ -f "results/$f" ] && cp "results/$f" . || true
          done

      - name: Run the engine
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          DIGEST_FROM_APP_PASSWORD: ${{ secrets.DIGEST_FROM_APP_PASSWORD }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}      # leave unset; "sandbox" only to test keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: outfit colours from photos
          VISION_MODEL: ${{ vars.VISION_MODEL }}               # optional; default claude-opus-5
          # The scan settings, as the website sent them. Empty on a scheduled
          # run, which leaves every engine default in place.
          SCAN_PLAYERS: ${{ inputs.players }}
          SCAN_BRANDS: ${{ inputs.brands }}
          SCAN_MAX_PRINT_RUN: ${{ inputs.max_print_run }}
          SCAN_PRINT_RUN_INCLUSIVE: ${{ inputs.print_run_inclusive }}
          SCAN_MIN_PRICE: ${{ inputs.min_price }}
          SCAN_MAX_PRICE: ${{ inputs.max_price }}
          SCAN_LISTING_TYPES: ${{ inputs.listing_types }}
          SCAN_CARD_TYPES: ${{ inputs.card_types }}
          SCAN_CONDITIONS: ${{ inputs.conditions }}
        run: python tennis_card_engine.py

      - name: Export what the hosted site reads
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}      # leave unset; "sandbox" only to test keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: outfit colours from photos
          VISION_MODEL: ${{ vars.VISION_MODEL }}               # optional; default claude-opus-5
        run: python export_static.py results

      - name: Keep the results in the repo
        run: |
          git config user.name  "tennis-card-engine"
          git config user.email "tennis-card-engine@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "Nothing new this run."
          else
            git commit -m "Scan results, $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Offer the spreadsheet as a download too
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tennis_cards_verified
          path: results/tennis_cards_verified.xlsx
          if-no-files-found: ignore
          retention-days: 30
