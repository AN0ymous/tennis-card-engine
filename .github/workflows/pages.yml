# Publishes the website to GitHub Pages: the page files plus the results the
# scheduled scan commits, so the site runs with no server. See IPAD_SETUP.md.
name: Publish the website

on:
  push:
    branches: [main]
    paths: ["web/**", "results/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Scan eBay for bookend cards"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                   # the scan commits results to main

      - name: Assemble the site
        run: |
          mkdir -p site/results
          cp -r web/. site/
          [ -d results ] && cp results/*.json results/*.xlsx site/results/ 2>/dev/null || true
          # Browsers keep app.js for a while, so a merge could leave a phone
          # running the old page against new results (run 29 on 17 Sep looked
          # like a failed fix for exactly that reason). Stamping the commit on
          # the asset links makes every publish fetch fresh copies.
          v="${GITHUB_SHA::12}"
          sed -i "s|assets/app.js\"|assets/app.js?v=$v\"|; s|assets/styles.css\"|assets/styles.css?v=$v\"|" site/index.html
          grep -n "assets/app.js\|assets/styles.css" site/index.html
          ls -R site | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
